[package]
name = "hopla"
version = "0.1.1"
edition = "2024"
description = "A palette for your GitHub accounts and secrets, with a bunny in a top hat"
repository = "https://github.com/mirkobozzetto/hopla"
readme = "README.md"
keywords = ["tui", "secrets", "git", "github", "keychain"]
categories = ["command-line-utilities"]
license = "MIT"
exclude = ["assets/", ".github/", "install.sh", "install.ps1"]

[dependencies]
arboard = "3"
ratatui = "0.30"
tachyonfx = "0.25"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
robius-authentication = "0.3.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
